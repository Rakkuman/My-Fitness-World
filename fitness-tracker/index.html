<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151816" />
    <title>Registro Fit</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Plan 5 dias</p>
          <h1>Registro Fit</h1>
        </div>
        <button class="icon-button" id="installButton" title="Instalar app" hidden>
          <span aria-hidden="true">+</span>
        </button>
      </header>

      <main>
        <section class="summary-grid" aria-label="Resumen">
          <article class="metric">
            <span>Peso inicial</span>
            <strong id="startWeight">130 kg</strong>
          </article>
          <article class="metric">
            <span>Peso actual</span>
            <strong id="currentWeight">--</strong>
          </article>
          <article class="metric">
            <span>Sesiones</span>
            <strong id="sessionCount">0</strong>
          </article>
          <article class="metric">
            <span>Racha</span>
            <strong id="streakCount">0 dias</strong>
          </article>
        </section>

        <nav class="tabs" aria-label="Secciones">
          <button class="tab is-active" data-view="today">Hoy</button>
          <button class="tab" data-view="plan">Rutina</button>
          <button class="tab" data-view="body">Medidas</button>
          <button class="tab" data-view="history">Historial</button>
        </nav>

        <section class="view is-active" id="todayView">
          <div class="section-head">
            <div>
              <p class="eyebrow">Entrenamiento</p>
              <h2 id="todayTitle">Dia de entrenamiento</h2>
            </div>
            <select id="daySelect" aria-label="Seleccionar dia"></select>
          </div>

          <div class="exercise-list" id="todayExercises"></div>

          <form class="panel form-grid" id="sessionForm">
            <label>
              Fecha
              <input type="date" id="sessionDate" required />
            </label>
            <label>
              Energia
              <select id="energy">
                <option value="5">5 - Excelente</option>
                <option value="4">4 - Buena</option>
                <option value="3" selected>3 - Normal</option>
                <option value="2">2 - Baja</option>
                <option value="1">1 - Muy baja</option>
              </select>
            </label>
            <label>
              Duracion
              <input type="number" id="duration" min="10" max="180" step="5" value="60" />
            </label>
            <label class="wide">
              Notas
              <textarea id="notes" rows="3" placeholder="Pesos usados, molestias, logros o ajustes"></textarea>
            </label>
            <button class="primary-button wide" type="submit">Guardar sesion</button>
          </form>
        </section>

        <section class="view" id="planView">
          <div class="section-head">
            <div>
              <p class="eyebrow">Semana</p>
              <h2>Rutina completa</h2>
            </div>
          </div>
          <div class="plan-grid" id="planGrid"></div>
        </section>

        <section class="view" id="bodyView">
          <div class="section-head">
            <div>
              <p class="eyebrow">Progreso</p>
              <h2>Medidas corporales</h2>
            </div>
          </div>
          <form class="panel form-grid" id="bodyForm">
            <label>
              Fecha
              <input type="date" id="bodyDate" required />
            </label>
            <label>
              Peso kg
              <input type="number" id="weight" min="30" max="300" step="0.1" required />
            </label>
            <label>
              Cintura cm
              <input type="number" id="waist" min="40" max="220" step="0.5" />
            </label>
            <label>
              Pecho cm
              <input type="number" id="chest" min="40" max="220" step="0.5" />
            </label>
            <label>
              Cadera cm
              <input type="number" id="hips" min="40" max="220" step="0.5" />
            </label>
            <label>
              Brazo cm
              <input type="number" id="arm" min="15" max="80" step="0.5" />
            </label>
            <button class="primary-button wide" type="submit">Guardar medidas</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Peso</th>
                  <th>Cintura</th>
                  <th>Pecho</th>
                  <th>Cadera</th>
                  <th>Brazo</th>
                </tr>
              </thead>
              <tbody id="bodyTable"></tbody>
            </table>
          </div>
        </section>

        <section class="view" id="historyView">
          <div class="section-head">
            <div>
              <p class="eyebrow">Registro</p>
              <h2>Historial</h2>
            </div>
            <div class="actions">
              <button class="ghost-button" id="exportButton" type="button">Exportar</button>
              <label class="ghost-button file-action">
                Importar
                <input type="file" id="importFile" accept="application/json" />
              </label>
            </div>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </main>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
